syntax = "proto3";
package polystorechain.polystorechain.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "polystorechain/polystorechain/v1/params.proto";
import "polystorechain/polystorechain/v1/proof.proto";
import "polystorechain/polystorechain/v1/types.proto"; // ADDED

option go_package = "polystorechain/x/polystorechain/types";

// Query defines the gRPC querier service.
service Query {
  // Complete bounded union of live session and retained audit generations.
  // No provider filter: both assigned providers and authorized deputies retain it.
  rpc RetainedGenerations(QueryRetainedGenerationsRequest) returns (QueryRetainedGenerationsResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/retained-generations";
  }

  // Current/previous bounded provider obligations, including distinct repair
  // readiness. Roots and generations describe retention, not current Deal state.
  rpc ListStorageAuditsByProvider(QueryListStorageAuditsByProviderRequest) returns (QueryListStorageAuditsByProviderResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/storage-audits/by-provider/{provider}";
  }
  rpc GetStorageAuditChallenge(QueryGetStorageAuditChallengeRequest) returns (QueryGetStorageAuditChallengeResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/storage-audits/{epoch_id}/{deal_id}/{slot}/{provider}";
  }

  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/params";
  }

  // Queries a list of Proof items.
  rpc ListProofs(QueryListProofsRequest) returns (QueryListProofsResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/proofs";
  }

  // Queries a list of Deal items.
  rpc ListDeals(QueryListDealsRequest) returns (QueryListDealsResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals";
  }

  // Queries a Deal by id.
  rpc GetDeal(QueryGetDealRequest) returns (QueryGetDealResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{id}";
  }

  rpc GetDealGenerationV3(QueryGetDealGenerationV3Request) returns (QueryGetDealGenerationV3Response) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/generation-v3";
  }
  rpc GetRetrievalSessionV3(QueryGetRetrievalSessionV3Request) returns (QueryGetRetrievalSessionV3Response) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/retrieval-sessions-v3/{session_id}";
  }
  rpc GetRetrievalSessionV3Nonce(QueryGetRetrievalSessionV3NonceRequest) returns (QueryGetRetrievalSessionV3NonceResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/retrieval-sessions-v3/by-owner/{owner}/deals/{deal_id}/nonce";
  }
  rpc GetRetrievalSessionV3ByNonce(QueryGetRetrievalSessionV3ByNonceRequest) returns (QueryGetRetrievalSessionV3ByNonceResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/retrieval-sessions-v3/by-owner/{owner}/deals/{deal_id}/nonces/{nonce}";
  }

  // Queries a list of Provider items.
  rpc ListProviders(QueryListProvidersRequest) returns (QueryListProvidersResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers";
  }

  // Queries a Provider by address.
  rpc GetProvider(QueryGetProviderRequest) returns (QueryGetProviderResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers/{address}";
  }

  // Queries the provider-centric health and lifecycle summary.
  rpc GetProviderHealth(QueryGetProviderHealthRequest) returns (QueryGetProviderHealthResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers/{address}/health";
  }

  // Lists provider-centric health and lifecycle summaries.
  rpc ListProviderHealth(QueryListProviderHealthRequest) returns (QueryListProviderHealthResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-health";
  }

  // Queries the provider-centric assignment collateral accounting summary.
  rpc GetProviderCollateral(QueryGetProviderCollateralRequest) returns (QueryGetProviderCollateralResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers/{address}/collateral";
  }

  // Lists provider-centric assignment collateral accounting summaries.
  rpc ListProviderCollateral(QueryListProviderCollateralRequest) returns (QueryListProviderCollateralResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-collateral";
  }

  // Queries observed staking-module binding status for a provider.
  rpc GetProviderStaking(QueryGetProviderStakingRequest) returns (QueryGetProviderStakingResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers/{provider}/staking";
  }

  // Lists observed staking-module binding status for providers.
  rpc ListProviderStaking(QueryListProviderStakingRequest) returns (QueryListProviderStakingResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-staking";
  }

  // Queries one stateful assignment collateral lock.
  rpc GetAssignmentCollateralLock(QueryGetAssignmentCollateralLockRequest) returns (QueryGetAssignmentCollateralLockResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers/{provider}/collateral-locks/{deal_id}/{slot}";
  }

  // Lists stateful assignment collateral locks for a provider.
  rpc ListAssignmentCollateralLocksByProvider(QueryListAssignmentCollateralLocksByProviderRequest) returns (QueryListAssignmentCollateralLocksByProviderResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers/{provider}/collateral-locks";
  }

  // Lists stateful assignment collateral locks for a deal.
  rpc ListAssignmentCollateralLocksByDeal(QueryListAssignmentCollateralLocksByDealRequest) returns (QueryListAssignmentCollateralLocksByDealResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/collateral-locks";
  }

  // Queries a pending provider-bond unbonding request by id.
  rpc GetProviderBondUnbonding(QueryGetProviderBondUnbondingRequest) returns (QueryGetProviderBondUnbondingResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-bond-unbondings/{id}";
  }

  // Lists pending provider-bond unbonding requests for a provider.
  rpc ListProviderBondUnbondingsByProvider(QueryListProviderBondUnbondingsByProviderRequest) returns (QueryListProviderBondUnbondingsByProviderResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/providers/{provider}/bond-unbondings";
  }

  // Queries the operator pairing for a provider address.
  rpc GetProviderPairing(QueryGetProviderPairingRequest) returns (QueryGetProviderPairingResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-pairings/{provider}";
  }

  // Lists paired providers for an operator address.
  rpc ListProvidersByOperator(QueryListProvidersByOperatorRequest) returns (QueryListProvidersByOperatorResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-pairings/by-operator/{operator}";
  }

  // Queries a pending provider link by provider address.
  rpc GetPendingProviderLink(QueryGetPendingProviderLinkRequest) returns (QueryGetPendingProviderLinkResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-pairings/pending/{provider}";
  }

  // Lists pending provider links for an operator address.
  rpc ListPendingProviderLinksByOperator(QueryListPendingProviderLinksByOperatorRequest) returns (QueryListPendingProviderLinksByOperatorResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/provider-pairings/pending-by-operator/{operator}";
  }

  // Queries activity counters for a deal.
  rpc GetDealActivity(QueryGetDealActivityRequest) returns (QueryGetDealActivityResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/activity";
  }

  // Queries the last accepted retrieval receipt nonce for a specific (deal_id, file_path).
  rpc GetReceiptNonce(QueryGetReceiptNonceRequest) returns (QueryGetReceiptNonceResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/receipt-nonce";
  }

  // Queries a RetrievalSession by id.
  rpc GetRetrievalSession(QueryGetRetrievalSessionRequest) returns (QueryGetRetrievalSessionResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/retrieval-sessions/{session_id}";
  }

  // Lists RetrievalSessions for an owner.
  rpc ListRetrievalSessionsByOwner(QueryListRetrievalSessionsByOwnerRequest) returns (QueryListRetrievalSessionsByOwnerResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/retrieval-sessions/by-owner/{owner}";
  }

  // Lists RetrievalSessions for a provider.
  rpc ListRetrievalSessionsByProvider(QueryListRetrievalSessionsByProviderRequest) returns (QueryListRetrievalSessionsByProviderResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/retrieval-sessions/by-provider/{provider}";
  }

  // Queries a virtual overlay stripe for a deal.
  rpc GetVirtualStripe(QueryGetVirtualStripeRequest) returns (QueryGetVirtualStripeResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/virtual-stripes/{stripe_index}";
  }

  // Lists virtual overlay stripes for a deal.
  rpc ListVirtualStripesByDeal(QueryListVirtualStripesByDealRequest) returns (QueryListVirtualStripesByDealResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/virtual-stripes";
  }

  // Queries the latest structured health state for a Mode 2 slot.
  rpc GetSlotHealth(QueryGetSlotHealthRequest) returns (QueryGetSlotHealthResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/slots/{slot}/health";
  }

  // Lists structured slot health states for a deal.
  rpc ListSlotHealthByDeal(QueryListSlotHealthByDealRequest) returns (QueryListSlotHealthByDealResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/slot-health";
  }

  // Queries explicit repair attempt/cooldown state for a Mode 2 slot.
  rpc GetRepairAttempt(QueryGetRepairAttemptRequest) returns (QueryGetRepairAttemptResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/slots/{slot}/repair-attempt";
  }

  // Lists explicit repair attempt/cooldown states for a deal.
  rpc ListRepairAttemptsByDeal(QueryListRepairAttemptsByDealRequest) returns (QueryListRepairAttemptsByDealResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/deals/{deal_id}/repair-attempts";
  }

  // Lists structured evidence cases, optionally filtered by deal.
  rpc ListEvidenceCases(QueryListEvidenceCasesRequest) returns (QueryListEvidenceCasesResponse) {
    option (google.api.http).get = "/polystorechain/polystorechain/v1/evidence";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryListProofsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListProofsResponse {
  repeated Proof proof = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListDealsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListDealsResponse {
  repeated Deal deals = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetDealRequest {
  uint64 id = 1;
}

message QueryGetDealResponse {
  Deal deal = 1;
}

message QueryListProvidersRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListProvidersResponse {
  repeated Provider providers = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetProviderRequest {
  string address = 1;
}

message QueryGetProviderResponse {
  Provider provider = 1;
}

// QueryGetProviderHealthRequest requests provider health by address.
message QueryGetProviderHealthRequest {
  string address = 1;
}

// QueryGetProviderHealthResponse returns provider-centric health state.
message QueryGetProviderHealthResponse {
  ProviderHealthState health = 1 [(gogoproto.nullable) = false];
}

// QueryListProviderHealthRequest lists provider health summaries.
message QueryListProviderHealthRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryListProviderHealthResponse returns provider health summaries.
message QueryListProviderHealthResponse {
  repeated ProviderHealthState health = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetProviderCollateralRequest requests provider assignment collateral by address.
message QueryGetProviderCollateralRequest {
  string address = 1;
}

// QueryGetProviderCollateralResponse returns provider assignment collateral accounting.
message QueryGetProviderCollateralResponse {
  ProviderCollateralSummary collateral = 1 [(gogoproto.nullable) = false];
}

// QueryListProviderCollateralRequest lists provider collateral summaries.
message QueryListProviderCollateralRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryListProviderCollateralResponse returns provider collateral summaries.
message QueryListProviderCollateralResponse {
  repeated ProviderCollateralSummary collateral = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetProviderStakingRequest requests observed staking linkage by provider.
message QueryGetProviderStakingRequest {
  string provider = 1;
}

// QueryGetProviderStakingResponse returns observed staking linkage status.
message QueryGetProviderStakingResponse {
  ProviderStakingSummary staking = 1 [(gogoproto.nullable) = false];
}

// QueryListProviderStakingRequest lists observed staking linkage summaries.
message QueryListProviderStakingRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryListProviderStakingResponse returns observed staking linkage summaries.
message QueryListProviderStakingResponse {
  repeated ProviderStakingSummary staking = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetAssignmentCollateralLockRequest requests one lock by provider/deal/slot.
message QueryGetAssignmentCollateralLockRequest {
  string provider = 1;
  uint64 deal_id = 2;
  uint32 slot = 3;
}

// QueryGetAssignmentCollateralLockResponse returns one assignment collateral lock.
message QueryGetAssignmentCollateralLockResponse {
  AssignmentCollateralLock lock = 1 [(gogoproto.nullable) = false];
}

// QueryListAssignmentCollateralLocksByProviderRequest lists locks by provider.
message QueryListAssignmentCollateralLocksByProviderRequest {
  string provider = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListAssignmentCollateralLocksByProviderResponse returns provider locks.
message QueryListAssignmentCollateralLocksByProviderResponse {
  repeated AssignmentCollateralLock locks = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryListAssignmentCollateralLocksByDealRequest lists locks by deal.
message QueryListAssignmentCollateralLocksByDealRequest {
  uint64 deal_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListAssignmentCollateralLocksByDealResponse returns deal locks.
message QueryListAssignmentCollateralLocksByDealResponse {
  repeated AssignmentCollateralLock locks = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetProviderBondUnbondingRequest requests a queued bond withdrawal by id.
message QueryGetProviderBondUnbondingRequest {
  uint64 id = 1;
}

// QueryGetProviderBondUnbondingResponse returns one queued bond withdrawal.
message QueryGetProviderBondUnbondingResponse {
  ProviderBondUnbonding unbonding = 1 [(gogoproto.nullable) = false];
}

// QueryListProviderBondUnbondingsByProviderRequest lists queued bond withdrawals.
message QueryListProviderBondUnbondingsByProviderRequest {
  string provider = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListProviderBondUnbondingsByProviderResponse returns provider withdrawals.
message QueryListProviderBondUnbondingsByProviderResponse {
  repeated ProviderBondUnbonding unbondings = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetProviderPairingRequest {
  string provider = 1;
}

message QueryGetProviderPairingResponse {
  ProviderPairing pairing = 1 [(gogoproto.nullable) = false];
}

message QueryListProvidersByOperatorRequest {
  string operator = 1;
}

message QueryListProvidersByOperatorResponse {
  repeated ProviderPairing pairings = 1 [(gogoproto.nullable) = false];
}

message QueryGetPendingProviderLinkRequest {
  string provider = 1;
}

message QueryGetPendingProviderLinkResponse {
  PendingProviderLink link = 1 [(gogoproto.nullable) = false];
}

message QueryListPendingProviderLinksByOperatorRequest {
  string operator = 1;
}

message QueryListPendingProviderLinksByOperatorResponse {
  repeated PendingProviderLink links = 1 [(gogoproto.nullable) = false];
}

message QueryGetDealActivityRequest {
  uint64 deal_id = 1;
}

message QueryGetDealActivityResponse {
  DealActivityState activity = 1 [(gogoproto.nullable) = false];
}

message QueryGetReceiptNonceRequest {
  uint64 deal_id = 1;
  string file_path = 2;
}

message QueryGetReceiptNonceResponse {
  uint64 last_nonce = 1;
}

message QueryGetRetrievalSessionRequest {
  bytes session_id = 1;
}

message QueryGetRetrievalSessionResponse {
  RetrievalSession session = 1 [(gogoproto.nullable) = false];
  // Computed from immutable session state; absent for legacy sessions.
  bytes challenge_context = 2;
  bytes challenge_context_hash = 3;
  // Exactly 32 bytes when captured and retained, otherwise empty. Never a fallback.
  bytes challenge_seed = 4;

}

message QueryListRetrievalSessionsByOwnerRequest {
  string owner = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListRetrievalSessionsByOwnerResponse {
  repeated RetrievalSession sessions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListRetrievalSessionsByProviderRequest {
  string provider = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListRetrievalSessionsByProviderResponse {
  repeated RetrievalSession sessions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetVirtualStripeRequest {
  uint64 deal_id = 1;
  uint32 stripe_index = 2;
}

message QueryGetVirtualStripeResponse {
  VirtualStripe stripe = 1 [(gogoproto.nullable) = false];
}

message QueryListVirtualStripesByDealRequest {
  uint64 deal_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListVirtualStripesByDealResponse {
  repeated VirtualStripe stripes = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetSlotHealthRequest requests the latest health state for a slot.
message QueryGetSlotHealthRequest {
  uint64 deal_id = 1;
  uint32 slot = 2;
}

// QueryGetSlotHealthResponse returns the latest health state for a slot.
message QueryGetSlotHealthResponse {
  SlotHealthState health = 1 [(gogoproto.nullable) = false];
}

// QueryListSlotHealthByDealRequest requests all slot health states for a deal.
message QueryListSlotHealthByDealRequest {
  uint64 deal_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListSlotHealthByDealResponse returns all slot health states for a deal.
message QueryListSlotHealthByDealResponse {
  repeated SlotHealthState health = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetRepairAttemptRequest requests repair attempt state for a slot.
message QueryGetRepairAttemptRequest {
  uint64 deal_id = 1;
  uint32 slot = 2;
}

// QueryGetRepairAttemptResponse returns repair attempt state for a slot.
message QueryGetRepairAttemptResponse {
  RepairAttemptState repair_attempt = 1 [(gogoproto.nullable) = false];
}

// QueryListRepairAttemptsByDealRequest requests repair attempt states by deal.
message QueryListRepairAttemptsByDealRequest {
  uint64 deal_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListRepairAttemptsByDealResponse returns repair attempt states by deal.
message QueryListRepairAttemptsByDealResponse {
  repeated RepairAttemptState repair_attempts = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryListEvidenceCasesRequest lists structured evidence cases.
message QueryListEvidenceCasesRequest {
  uint64 deal_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListEvidenceCasesResponse returns structured evidence cases.
message QueryListEvidenceCasesResponse {
  repeated EvidenceCase evidence = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListStorageAuditsByProviderRequest { string provider = 1; }
message StorageAuditView {
  FrozenStorageAudit audit = 1;
  uint64 epoch_length = 2;
  bytes canonical_context = 3;
  bytes seed = 4;
  bool finalized = 5;
}
message QueryListStorageAuditsByProviderResponse { repeated StorageAuditView audits = 1 [(gogoproto.nullable) = false]; }
message QueryGetStorageAuditChallengeRequest {
  uint64 epoch_id = 1;
  uint64 deal_id = 2;
  uint32 slot = 3;
  string provider = 4;
}
message StorageAuditChallenge {
  uint64 ordinal = 1;
  uint64 population_index = 2;
  uint64 mdu_index = 3;
  uint32 leaf_index = 4;
  bytes z = 5;
}
message QueryGetStorageAuditChallengeResponse {
  StorageAuditView audit = 1;
  repeated StorageAuditChallenge challenges = 2 [(gogoproto.nullable) = false];
}

message QueryRetainedGenerationsRequest {}
message RetainedGeneration {
  uint64 deal_id = 1;
  uint64 generation = 2;
  bytes manifest_root = 3;
}
message QueryRetainedGenerationsResponse {
  uint64 committed_height = 1;
  repeated RetainedGeneration generations = 2 [(gogoproto.nullable) = false];
}

message QueryGetDealGenerationV3Request {
  uint64 deal_id = 1;
}

message QueryGetDealGenerationV3Response {
  DealGenerationAdmissionV3 pending = 1;
  DealGenerationAdmissionV3 admitted = 2;
}

message QueryGetRetrievalSessionV3Request { bytes session_id = 1; }
message QueryGetRetrievalSessionV3Response {
  RetrievalSessionV3 session = 1 [(gogoproto.nullable) = false];
  // Raw H+1 block anchor bytes. Derive ContextV3.Seed(anchor_seed) before
  // passing the result to ContextV3.Challenges. Empty before capture and after
  // the anchor is released.
  bytes anchor_seed = 2;
}

message QueryGetRetrievalSessionV3NonceRequest {
  string owner = 1;
  uint64 deal_id = 2;
}
message QueryGetRetrievalSessionV3NonceResponse {
  uint64 nonce = 1;
  bool found = 2;
}
message QueryGetRetrievalSessionV3ByNonceRequest {
  string owner = 1;
  uint64 deal_id = 2;
  uint64 nonce = 3;
}
message QueryGetRetrievalSessionV3ByNonceResponse { bytes session_id = 1; }
